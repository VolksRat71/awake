name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64

    steps:
      - uses: actions/checkout@v4

      # Pinning an old toolchain here shipped a binary macOS 26 refuses to
      # launch: Go 1.22's linker omits LC_UUID under -s -w, and dyld rejects
      # the result with "missing LC_UUID load command". Build with a current
      # toolchain; go.mod still declares 1.22 as the language minimum.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          TAG: ${{ github.ref_name }}
        run: |
          go build -ldflags="-s -w" -o awake .

          # A stripped build that dyld will not load is worse than no release,
          # and it is invisible until someone installs it. Verify the load
          # command is there, and actually launch the native slice.
          python3 - awake <<'EOF'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          ncmds = struct.unpack_from('<I', data, 16)[0]
          off = 32
          for _ in range(ncmds):
              cmd, size = struct.unpack_from('<II', data, off)
              if cmd == 0x1b:
                  print("LC_UUID present:", data[off + 8:off + 24].hex())
                  sys.exit(0)
              off += size
          sys.exit("LC_UUID missing - dyld on macOS 26+ will refuse to launch this binary")
          EOF

          if [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            ./awake --help > /dev/null
            echo "smoke test passed: binary launches"
          fi

          tar czf "awake-${TAG}-${SUFFIX}.tar.gz" awake
          shasum -a 256 "awake-${TAG}-${SUFFIX}.tar.gz" > "awake-${TAG}-${SUFFIX}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: awake-${{ matrix.suffix }}
          path: |
            awake-*.tar.gz
            awake-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/awake-*.tar.gz
            dist/awake-*.sha256

      - name: Update Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ARM64_SHA=$(cat dist/awake-*-darwin-arm64.tar.gz.sha256 | awk '{print $1}')
          AMD64_SHA=$(cat dist/awake-*-darwin-amd64.tar.gz.sha256 | awk '{print $1}')

          sed -i "s|version \".*\"|version \"${TAG#v}\"|" Formula/awake.rb
          sed -i "s|/download/v[^/]*/awake-v[^-]*-darwin-arm64|/download/${TAG}/awake-${TAG}-darwin-arm64|" Formula/awake.rb
          sed -i "s|/download/v[^/]*/awake-v[^-]*-darwin-amd64|/download/${TAG}/awake-${TAG}-darwin-amd64|" Formula/awake.rb
          sed -i "s|sha256 \"PLACEHOLDER_ARM64_SHA256\"|sha256 \"${ARM64_SHA}\"|" Formula/awake.rb
          sed -i "s|sha256 \"PLACEHOLDER_AMD64_SHA256\"|sha256 \"${AMD64_SHA}\"|" Formula/awake.rb
          # Also handle updates to existing real hashes
          sed -i "/darwin-arm64/{n;s|sha256 \"[a-f0-9]\{64\}\"|sha256 \"${ARM64_SHA}\"|;}" Formula/awake.rb
          sed -i "/darwin-amd64/{n;s|sha256 \"[a-f0-9]\{64\}\"|sha256 \"${AMD64_SHA}\"|;}" Formula/awake.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/awake.rb
          git commit -m "chore: update Homebrew formula for ${TAG}" || true
          git push origin HEAD:main
